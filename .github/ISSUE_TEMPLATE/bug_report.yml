name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems: please use **Security → Report a vulnerability** instead of this form.
  - type: input
    id: version
    attributes:
      label: Lumiere Pro version
      description: Shown in the app header (for example v0.1.0).
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options: [Installer (setup.exe), Built from source - npm run app, Browser dev - npm run dev]
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import a video
        2. ...
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Media details (if relevant)
      description: Output of `ffprobe -v error -show_format -show_streams <file>` is ideal. Do not attach private footage.
  - type: textarea
    id: mcp
    attributes:
      label: MCP / Claude Code details (if relevant)
      description: Tool called, arguments, and the result or error code.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
