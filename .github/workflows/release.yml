name: Release

# Push a tag like v1.2.3 (after `npm run version:set -- 1.2.3` and updating CHANGELOG.md).
# Creates a DRAFT release with the Windows installer and its SHA-256; a maintainer reviews and publishes it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci

      - name: Tag must match the package version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm run version:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:mcp
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: node scripts/release-notes.mjs "$VERSION" > release-notes.md
      - run: npm run app:build

      - name: Checksum and draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          installer="$(ls apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)"
          cp "$installer" "LumierePro_${VERSION}_x64-setup.exe"
          sha256sum "LumierePro_${VERSION}_x64-setup.exe" > "LumierePro_${VERSION}_x64-setup.exe.sha256"
          flags=""
          case "$VERSION" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" \
            "LumierePro_${VERSION}_x64-setup.exe" "LumierePro_${VERSION}_x64-setup.exe.sha256" \
            --draft --verify-tag $flags \
            --title "Lumiere Pro $VERSION" --notes-file release-notes.md
