[package]
name = "lumiere-pro"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ipuppyyt/lumiere-pro"
homepage = "https://github.com/ipuppyyt/lumiere-pro"
description = "Lumiere Pro desktop shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
